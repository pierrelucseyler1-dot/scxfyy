name: Build installer
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the project folder
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Recurse -Filter package.json -File | Where-Object { $_.FullName -notmatch 'node_modules' -and (Select-String -Path $_.FullName -Pattern '"name": "scxfyy-launcher"' -Quiet) } | Select-Object -First 1
          if (-not $pkg) { throw 'package.json was not found. Check that the files were uploaded.' }
          $root = $pkg.DirectoryName
          if (-not (Test-Path "$root\mod\build.gradle")) {
            $g = Get-ChildItem -Recurse -Filter build.gradle -File | Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1
            if (-not $g) { throw 'The mod folder (build.gradle) was not found. Upload the files from 2-upload-second.' }
            Copy-Item $g.DirectoryName "$root\mod" -Recurse -Force
          }
          Write-Host "Project folder: $root"
          Get-ChildItem $root | Select-Object -ExpandProperty Name
          "PROJECT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install
      - name: Build the exe files
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Collect the exe files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          Copy-Item "$env:PROJECT_ROOT\dist\*.exe" "$env:GITHUB_WORKSPACE\out\"
      - name: Publish a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: scxfyy launcher build ${{ github.run_number }}
          files: |
            out/scxfyy-launcher.exe
            out/scxfyy-launcher-setup.exe
